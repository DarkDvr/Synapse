<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Synapse chat lab</title>
  <link rel="stylesheet" href="/web/vendor/fonts.css" />
  <link rel="stylesheet" href="/web/baseline.css" />
  <link rel="stylesheet" href="/web/synapse.css" />
  <link rel="stylesheet" href="/web/panel.css" />
  <!-- The lab is not the app: two fixed-height scrollers side by side, so a scenario has a
       real viewport to scroll in and the old and the new renderer can be compared on the
       same conversation, with the same stylesheet. Each dock sits inside a plain wrapper:
       panel.css places `.chat-dock` in the app's own grid, and inside a block it is just a
       block, which is what a lab needs. What is measured here is what ships. -->
  <style>
    html, body { margin: 0; height: 100%; background: #151619; }
    body { color: var(--text); }
    #lab { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: minmax(0, 1fr); gap: 12px; padding: 10px; box-sizing: border-box; height: 100%; }
    /* The app's own rules for the dock are scoped to `body[data-view]` and win on a plain
       class, so these carry the id: the lab needs a fixed box, and that is the whole point. */
    #lab .lab-pane { position: relative; min-width: 0; min-height: 0; height: 100%; overflow: hidden; }
    #lab .lab-pane .chat-dock { display: block; height: 100%; }
    #lab .lab-pane .chat-scroll { height: 100%; }
    .lab-label { position: absolute; z-index: 5; top: 2px; right: 6px; font: 600 10px/1.4 var(--mono, monospace); letter-spacing: .08em; color: #82868e; }
  </style>
</head>
<body class="dark" data-view="session" data-mode="single">
  <div id="lab">
    <div class="lab-pane">
      <span class="lab-label">OLD</span>
      <section class="chat-dock has-history" id="dock1"><div class="chat-scroll" id="transcript"></div></section>
    </div>
    <div class="lab-pane">
      <span class="lab-label">NEW</span>
      <section class="chat-dock has-history" id="dock2"><div class="chat-scroll" id="transcript-v2"></div></section>
    </div>
  </div>
  <script type="module" src="/lab.js"></script>
</body>
</html>
